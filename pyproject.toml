[project]
name = "wpcap"
version = "0.1.0"
description = "WorkPrinter Capture: modern replacement for CineCap"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=10.4,<12",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=43,<47",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    # The FastAPI/Starlette TestClient runs on httpx2 (starlette >= 1.2 warns that plain httpx
    # is deprecated for it).
    "httpx2>=2.13,<3",
    "starlette>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpcap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
